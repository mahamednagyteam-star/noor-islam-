name: Build Android APK

on:
  push:
    branches:
      - main
      - master
      - feature/complete-app-enhancements
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: noor-islam-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Clean build and assemble release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: "1"
      npm_config_cache: ${{ runner.temp }}/npm-cache

    steps:
      - name: Checkout clean source
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 1

      - name: Clear repository Actions caches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t CACHE_IDS < <(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/caches?per_page=100" --jq '.actions_caches[].id')
          echo "Found ${#CACHE_IDS[@]} Actions cache entries."
          for cache_id in "${CACHE_IDS[@]}"; do
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/caches/${cache_id}" >/dev/null
            echo "Deleted cache ${cache_id}"
          done
          echo "Actions cache cleanup complete."

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Remove temporary build data
        shell: bash
        run: |
          set -euo pipefail
          rm -rf node_modules android .expo
          rm -rf "${HOME}/.gradle/caches" "${HOME}/.gradle/daemon" "${HOME}/.gradle/native"
          rm -rf "${npm_config_cache}"
          mkdir -p "${npm_config_cache}"
          npm cache verify || true
          echo "Workspace and local build caches cleared."

      - name: Install dependencies from scratch
        run: npm install --no-audit --no-fund

      - name: Prepare app data
        run: npm run prepare:data

      - name: Validate Quran, mushaf pages, and adhkar data
        run: node -e "const q=require('./data/quran-uthmani.json'); const p=require('./data/quran-pages.json'); const h=require('./data/hisn-muslim.json'); if(!Array.isArray(q)||q.length!==114||!Array.isArray(p)||p.length!==604||p[0].p!==1||p[0].s!==1||p[0].a!==1||p.some((x,i)=>x.p!==i+1||x.s<1||x.s>114||x.a<1)||!h||typeof h!=='object') throw new Error('Quran/page/adhkar data validation failed'); console.log('Validated',q.length,'surahs,',p.length,'mushaf pages and',Object.keys(h).length,'adhkar sections')"

      - name: Generate fresh native Android project
        run: npx expo prebuild --platform android --clean

      - name: Install Android NDK with retry
        shell: bash
        env:
          ANDROID_NDK_VERSION: 26.1.10909125
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "${SDKMANAGER}" ]]; then
            SDKMANAGER="$(find "${SDK_ROOT}/cmdline-tools" -type f -name sdkmanager -perm -u+x 2>/dev/null | sort | tail -n 1 || true)"
          fi
          if [[ -z "${SDKMANAGER}" || ! -x "${SDKMANAGER}" ]]; then
            echo "Could not find Android sdkmanager under ${SDK_ROOT}"
            exit 1
          fi
          for attempt in 1 2 3; do
            echo "Installing NDK ${ANDROID_NDK_VERSION} (attempt ${attempt}/3)"
            rm -rf "${SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}"
            if "${SDKMANAGER}" --sdk_root="${SDK_ROOT}" --install "ndk;${ANDROID_NDK_VERSION}"; then
              if [[ -x "${SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" ]]; then
                echo "NDK installation verified."
                exit 0
              fi
              echo "NDK installation returned success but clang is missing."
            fi
            sleep $((attempt * 10))
          done
          echo "NDK installation failed after three attempts."
          exit 1

      - name: Build release APK without Gradle build cache
        working-directory: android
        env:
          NODE_ENV: production
        run: ./gradlew --no-build-cache --no-configuration-cache --refresh-dependencies clean assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: noor-islam-android-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
