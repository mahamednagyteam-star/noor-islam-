name: Build Android APK

on:
  push:
    branches:
      - main
      - master
      - feature/complete-app-enhancements
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: noor-islam-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build and validate Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Prepare app data
        run: npm run prepare:data
      - name: TypeScript type check
        run: npm run typecheck
      - name: Validate Quran page boundaries
        run: npm run validate:quran-pages
      - name: Validate app data
        run: node -e "const q=require('./data/quran-uthmani.json'); const h=require('./data/hisn-muslim.json'); if(!Array.isArray(q)||q.length!==114||!h||typeof h!=='object'||Array.isArray(h)) throw new Error('App data validation failed'); console.log('Validated Quran surahs:',q.length,'; adhkar sections:',Object.keys(h).length)"
      - name: Generate native Android project
        run: npx expo prebuild --platform android --clean
      - name: Install Android NDK with retry
        shell: bash
        env:
          ANDROID_NDK_VERSION: 26.1.10909125
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "${SDKMANAGER}" ]]; then
            SDKMANAGER="$(find "${SDK_ROOT}/cmdline-tools" -type f -name sdkmanager -perm -u+x 2>/dev/null | sort | tail -n 1 || true)"
          fi
          if [[ -z "${SDKMANAGER}" || ! -x "${SDKMANAGER}" ]]; then
            echo "Could not find Android sdkmanager under ${SDK_ROOT}"
            exit 1
          fi
          for attempt in 1 2 3; do
            echo "Installing NDK ${ANDROID_NDK_VERSION} (attempt ${attempt}/3)"
            if "${SDKMANAGER}" --sdk_root="${SDK_ROOT}" --install "ndk;${ANDROID_NDK_VERSION}"; then
              if [[ -x "${SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" ]]; then
                echo "NDK installation verified."
                exit 0
              fi
              echo "NDK installation returned success but clang is missing."
            fi
            sleep $((attempt * 10))
          done
          echo "NDK installation failed after three attempts."
          exit 1
      - name: Build release APK
        working-directory: android
        env:
          NODE_ENV: production
        run: ./gradlew assembleRelease
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: noor-islam-android-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
