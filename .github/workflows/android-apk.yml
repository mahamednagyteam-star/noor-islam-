name: Build Android APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: noor-islam-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: 1
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Remove previous workflow run history (one-time cleanup)
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[cleanup-old-runs]')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t OLD_RUN_IDS < <(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100" --jq ".workflow_runs[].id | select(. != ${GITHUB_RUN_ID})")
          echo "Found ${#OLD_RUN_IDS[@]} older workflow runs."
          # Cancel active/queued runs first so GitHub allows their records to be deleted.
          for run_id in "${OLD_RUN_IDS[@]}"; do
            status="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '.status' 2>/dev/null || echo missing)"
            if [[ "${status}" != "completed" && "${status}" != "missing" ]]; then
              gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/cancel" >/dev/null 2>&1 || true
            fi
          done
          for run_id in "${OLD_RUN_IDS[@]}"; do
            status="unknown"
            for attempt in {1..30}; do
              status="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '.status' 2>/dev/null || echo missing)"
              [[ "${status}" == "completed" || "${status}" == "missing" ]] && break
              sleep 2
            done
            if [[ "${status}" == "completed" ]]; then
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" >/dev/null || echo "Could not delete run ${run_id}"
            else
              echo "Skipping run ${run_id}; status is ${status}"
            fi
          done
          echo "Old workflow-run cleanup finished."
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install dependencies
        run: npm install
      - name: Download app data
        run: npm run prepare:data
      - name: Validate data files
        run: node -e "const q=require('./data/quran-uthmani.json'); const h=require('./data/hisn-muslim.json'); if(!Array.isArray(q)||q.length!==114||!h||typeof h!=='object') process.exit(1); console.log('Validated Quran surahs:',q.length,'; adhkar sections:',Object.keys(h).length)"
      - name: Generate native Android project
        run: npx expo prebuild --platform android
      - name: Install Android NDK with retry
        shell: bash
        env:
          ANDROID_NDK_VERSION: 26.1.10909125
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "${SDKMANAGER}" ]]; then
            SDKMANAGER="$(find "${SDK_ROOT}/cmdline-tools" -type f -name sdkmanager -perm -u+x 2>/dev/null | sort | tail -n 1)"
          fi
          if [[ -z "${SDKMANAGER}" || ! -x "${SDKMANAGER}" ]]; then
            echo "Could not find Android sdkmanager under ${SDK_ROOT}"
            exit 1
          fi
          for attempt in 1 2 3; do
            echo "Installing NDK ${ANDROID_NDK_VERSION} (attempt ${attempt}/3)"
            rm -rf "${SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}"
            if "${SDKMANAGER}" --sdk_root="${SDK_ROOT}" --install "ndk;${ANDROID_NDK_VERSION}"; then
              if [[ -x "${SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" ]]; then
                echo "NDK ${ANDROID_NDK_VERSION} installed and verified."
                exit 0
              fi
              echo "NDK installation returned success but clang is missing."
            fi
            sleep $((attempt * 10))
          done
          echo "NDK installation failed after three attempts."
          exit 1
      - name: Build release APK
        working-directory: android
        env:
          NODE_ENV: production
        run: ./gradlew assembleRelease
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: noor-islam-android-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
