name: Actions Diagnostic

on:
  push:
    branches:
      - feature/complete-app-enhancements
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm runner starts
        run: |
          echo "GitHub Actions runner started successfully."
          echo "Branch: ${GITHUB_REF}"
          echo "Commit: ${GITHUB_SHA}"
